<body>
    <div class="login">
        <h1>Login</h1>
        <form action="login.php" method="POST">

                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>

            <a href="../register/register.html">Create new account</a>
        </form>
    </div>
